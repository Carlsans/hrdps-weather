[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrdps-weather"
version = "1.0.0"
description = "Météo HRDPS (Environnement Canada, 2,5 km) : carte animée, graphiques, module waybar et icône de zone de notification Windows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.1",
  "pycairo>=1.25",
  "tzdata; sys_platform == 'win32'",
  "pystray>=0.19; sys_platform == 'win32'",
]

[project.optional-dependencies]
tray = ["pystray>=0.19"]
test = ["pytest>=8"]
build = ["pyinstaller>=6.6"]

[project.scripts]
hrdps-weather = "hrdps_weather.cli:main"

[project.gui-scripts]
hrdps-weather-tray = "hrdps_weather.cli:tray_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hrdps_weather = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
