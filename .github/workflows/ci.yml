name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - { os: ubuntu-22.04, python: "3.10" }   # oldest supported (the Linux binary is built with it)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Cairo headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config python3-dev
      - name: Tk and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends python3-tk xvfb xauth fonts-dejavu-core
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -v
        if: runner.os != 'Linux'
      - run: xvfb-run -a python -m pytest -v
        if: runner.os == 'Linux'
      - run: python -m hrdps_weather selftest

  web:
    # The web app's data layer (web/js/hrdps.js) must give exactly what the Python one gives.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config python3-dev
      - run: python -m pip install -e .
      - run: python web/tests/make_expected.py "$RUNNER_TEMP/expected.json"
      - run: EXPECTED="$RUNNER_TEMP/expected.json" node --test "tests/*.test.mjs"
        working-directory: web
