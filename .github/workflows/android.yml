name: Android build

# The Android app (android/): the web app in a WebView plus a native home-screen widget.
# Every push touching it runs the unit tests and builds an APK (downloadable as a workflow artifact);
# on a tag (v*) the signed APK, its SHA-256 and the Ed25519 signature are attached to the release.
# Signing needs two repository secrets, ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["android/**", "src/hrdps_weather/__init__.py", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write          # attach assets to the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python package (reference output for the widget's tests)
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config python3-dev
          python -m pip install -e .
          python web/tests/make_expected.py "$RUNNER_TEMP/expected.json"

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HRDPS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HRDPS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets missing: a release APK must be signed"
            exit 1
          else
            echo "No keystore: building an unsigned APK (tests only)"
          fi

      - name: Unit tests (widget logic = Python output) and APK
        working-directory: android
        env:
          EXPECTED: ${{ runner.temp }}/expected.json
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          mkdir -p ../dist
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || apk=app/build/outputs/apk/release/app-release-unsigned.apk
          cp "$apk" ../dist/hrdps-weather-android.apk

      - name: Check the signature
        if: env.HRDPS_KEYSTORE != ''
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs dist/hrdps-weather-android.apk | head -3

      - name: Hash and sign the checksum (same Ed25519 key as the other platforms)
        env:
          UPDATE_SIGNING_SEED: ${{ secrets.UPDATE_SIGNING_SEED }}
        run: |
          (cd dist && sha256sum hrdps-weather-android.apk > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt)
          python packaging/sign.py dist/SHA256SUMS-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hrdps-weather-android
          path: dist/

      - name: Attach to the release and merge the notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes ""
          # The Windows and Linux builds edit the same release at the same time: an upload can be refused (HTTP 422)
          # although it is fine a moment later. Retry instead of failing the build and skipping the notes.
          ok=0
          for attempt in 1 2 3 4; do
            if gh release upload "${{ github.ref_name }}" dist/hrdps-weather-android.apk dist/SHA256SUMS-android.txt $(ls dist/SHA256SUMS-android.txt.sig 2>/dev/null) --clobber; then ok=1; break; fi
            echo "upload failed (attempt $attempt), retrying"; sleep $((attempt * 6))
          done
          [ "$ok" = 1 ] || exit 1
          python packaging/release-notes.py "${{ github.ref_name }}" android dist/SHA256SUMS-android.txt
